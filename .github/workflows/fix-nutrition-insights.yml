name: Fix Nutrition Insights Syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-nutrition:
    if: github.actor == 'WashekFitness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Nutrition Insights with syntax fixes
        run: |
          git fetch origin a968da1d2f11ed3bd2a06a881dacd39a3a523ead --depth=1
          git show a968da1d2f11ed3bd2a06a881dacd39a3a523ead:src/pages/Nutrition.jsx > src/pages/Nutrition.jsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/Nutrition.jsx')
          s = p.read_text()
          s = s.replace("insights.push('You're currently close to your calorie target for the day. Keep portions consistent with your goal.');", 'insights.push("You\'re currently close to your calorie target for the day. Keep portions consistent with your goal.");')
          s = s.replace("insights.push('You're about ${Math.round(proteinRemaining)}g short of your protein target. Prioritize a protein-rich food in your next meal.');", "insights.push(`You're about ${Math.round(proteinRemaining)}g short of your protein target. Prioritize a protein-rich food in your next meal.`);")
          p.write_text(s)
          PY

      - name: Commit corrected Nutrition page
        run: |
          git config user.name "WashekFitness"
          git config user.email "washekfitness@gmail.com"
          git add src/pages/Nutrition.jsx
          git rm .github/workflows/fix-nutrition-insights.yml
          git diff --cached --check
          git diff --cached --quiet || git commit -m "Fix Nutrition Insights syntax errors"
          git push origin HEAD:main
